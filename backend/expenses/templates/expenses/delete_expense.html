<!DOCTYPE html>
<html>
<head>
    <title>Delete Expense</title>
</head>
<body>

    <h2>Delete Expense</h2>

    <p>
        Are you sure you want to delete
        <strong>{{ expense.title }}</strong>?
    </p>

    <form method="post">
        {% csrf_token %}

        <button type="submit">Yes, Delete</button>

        <a href="{% url 'expense_list' %}">Cancel</a>
    </form>

</body>
</html>
