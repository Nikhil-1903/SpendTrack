<!DOCTYPE html>
<html>
<head>
    <title>Expense Tracker</title>
</head>
<body>

<h1>My Expenses</h1>
    <p><a href="/expenses/add/">➕ Add Expense</a></p>
    <form method = "get">
        <input type = "text" name="category" placeholder="Search category">
        <button type="submit">Search</button>
    </form>
    
    <table border="1">

        <tr>
            <th>Title</th>
            <th>Amount</th>
            <th>Category</th>
            <th>Date</th>
            <th>Action</th>
        </tr>

        {% for expense in expenses %}
        <tr>
            <td>{{expense.title}}</td>
            <td>{{expense.amount}}</td>
            <td>{{expense.category}}</td>
            <td>{{expense.date}}</td>
            <td><a href="{% url 'edit_expense' expense.id %}">Edit</a>
                |
                <a href="{% url 'delete_expense' expense.id %}">Delete</a>
            </td>

        </tr>
        {% endfor %}

    </table>

</body>
</html>
